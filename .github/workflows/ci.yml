# On every push and pull request: Kel builds, its tests pass, clippy has
# nothing to say. On Windows, Linux and macOS, each on its own machine:
# code for one system can break another one's build (a Windows-only call).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      # One system failing doesn't stop the others: we see all that's wrong at once.
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

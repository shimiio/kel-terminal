[package]
name = "kel-terminal"
version = "0.1.0"
edition = "2024"

[dependencies]
portable-pty = "0.9.0"
anyhow = "1"
vte = "0.15.0"
winit = "0.30.13"
softbuffer = "0.4.8"
window-vibrancy = "0.8.1"
fontdue = "0.9.4"
arboard = "3.7.0"

# Debug builds: optimize the libraries (fontdue rasterizing was ~35x slower without it),
# keep our own code lightly optimized so it still compiles fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

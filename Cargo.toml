[package]
name = "kel-terminal"
version = "0.1.1"
edition = "2024"
description = "A terminal with tabs and projects, for daily work"
license = "MIT OR Apache-2.0"
repository = "https://github.com/shimiio/kel-terminal"

# The program is `kel.exe`: `kel <project>` (see install.ps1).
[[bin]]
name = "kel"
path = "src/main.rs"

[dependencies]
portable-pty = "0.9.0"
anyhow = "1"
vte = "0.15.0"
winit = "0.30.13"
softbuffer = "0.4.8"
window-vibrancy = "0.8.1"
arboard = "3.7.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
fontdb = "0.24.0"
unicode-width = "0.2"
ttf-parser = "0.25.1"
ab_glyph = "0.2.32"

# Only while building: the icon into kel.exe (see build.rs). winresource runs the
# Windows SDK's rc.exe; png writes the icon's pictures.
[build-dependencies]
winresource = "0.1"
png = "0.18.1"

# Debug builds: optimize the libraries (rasterizing letters is ~35x slower without it),
# keep our own code lightly optimized so it still compiles fast.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
